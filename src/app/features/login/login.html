<section class="login">
  <form class="login__form">
    <fieldset class="login__field">
      <label class="login__label" for="username">Username
        <input class="login__input" type="user" [formField]="loginForm.user" />
    <!-- Solo muestra el error si el usuario ya tocó el campo -->
      @if (loginForm.user().touched() && loginForm.user().invalid()) {
      <span class="error">
      {{ loginForm.user().errors()[0].message }}
      </span>
      }
      </label>
    </fieldset>
    <fieldset class="login__field">
      <label class="login__label" >password
      <input class="login__input"type="password" [formField]="loginForm.password" />
        @if (loginForm.password().invalid() && loginForm.password().touched()) {
          @for (error of loginForm.password().errors(); track error) {
            <span>{{ error.message }}</span>
          }
        }
        </label>
    </fieldset>
    <button (click)="doLogin()" [disabled]="loginForm.user().invalid() || loginForm.password().invalid()" >Entrar</button>
  </form>
</section>
